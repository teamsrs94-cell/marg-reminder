<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a5fd1"><title>{% block title %}Marg Reminder{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css"></head><body>
{% if user %}
<header class="top"><span class="logo">🔔 Marg Reminder</span>
<a href="/account" class="mute">{{ user.name }}</a>
<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn ghost sm">Logout</button></form></header>
{% set p = request.url.path %}
<nav class="main">
<a href="/" class="{{ 'on' if p=='/' }}"><b>🏠</b>Home</a>
<a href="/subscriptions" class="{{ 'on' if p.startswith('/subscriptions') }}"><b>📋</b>Renewals</a>
<a href="/customers" class="{{ 'on' if p.startswith('/customers') }}"><b>👥</b>Customers</a>
<a href="/reminders" class="{{ 'on' if p.startswith('/reminders') }}"><b>✉️</b>Reminders</a>
{% if user.is_admin %}<a href="/distributors" class="{{ 'on' if p.startswith('/distributors') }}"><b>🏢</b>Distributors</a>{% endif %}
<a href="/import" class="{{ 'on' if p.startswith('/import') }}"><b>⬆️</b>Import</a>
</nav>
{% endif %}
<main>{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}{% block body %}{% endblock %}</main>
</body></html>
